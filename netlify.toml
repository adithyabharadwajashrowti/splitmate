[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send every route to index.html (prevents 404 / blank screen on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
